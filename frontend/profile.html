<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CareerOne - Student Profile</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<nav class="navbar">

    <div class="logo">
        Career<span>One</span>
    </div>

</nav>



<div style="
    max-width:700px;
    margin:60px auto;
    padding:20px;
">


    <div class="feature-card">


        <h1>
            👤 Create Your Career Profile
        </h1>


        <p style="
            color:#697386;
            margin:10px 0 30px;
        ">

            Tell us about yourself so
            CareerOne can analyze your
            career path.

        </p>



        <!-- NAME -->

        <input
            id="name"
            type="text"
            placeholder="Full Name"
            style="
                width:100%;
                padding:14px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >



        <!-- BRANCH -->

        <input
            id="branch"
            type="text"
            placeholder="Branch e.g. CSE"
            style="
                width:100%;
                padding:14px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >



        <!-- YEAR -->

        <input
            id="year"
            type="text"
            placeholder="Year e.g. 3rd Year"
            style="
                width:100%;
                padding:14px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >



        <!-- SKILLS -->

        <input
            id="skills"
            type="text"
            placeholder="Skills e.g. HTML, CSS, JavaScript, Python"
            style="
                width:100%;
                padding:14px;
                margin-bottom:15px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >



        <!-- CAREER GOAL -->

        <select
            id="careerGoal"
            style="
                width:100%;
                padding:14px;
                margin-bottom:20px;
                border:1px solid #ddd;
                border-radius:8px;
            "
        >

            <option value="">
                Select Career Goal
            </option>


            <option value="Software Developer">
                Software Developer
            </option>


            <option value="Data Scientist">
                Data Scientist
            </option>


            <option value="AI/ML Engineer">
                AI/ML Engineer
            </option>


            <option value="Web Developer">
                Web Developer
            </option>

        </select>



        <!-- ANALYZE BUTTON -->

        <button
            class="primary-btn"
            style="width:100%;"
            onclick="analyzeCareer()"
        >

            🤖 Analyze My Career

        </button>



        <p
            id="message"
            style="
                text-align:center;
                margin-top:20px;
            "
        ></p>


    </div>

</div>



<script>

async function analyzeCareer() {


    const name =
        document.getElementById("name")
        .value.trim();


    const branch =
        document.getElementById("branch")
        .value.trim();


    const year =
        document.getElementById("year")
        .value.trim();


    const skills =
        document.getElementById("skills")
        .value.trim();


    const careerGoal =
        document.getElementById("careerGoal")
        .value;


    const message =
        document.getElementById("message");



    // ================= VALIDATION =================

    if (
        !name ||
        !branch ||
        !year ||
        !skills ||
        !careerGoal
    ) {

        message.style.color = "red";

        message.innerText =
            "Please fill all fields.";

        return;

    }



    message.style.color = "#635bff";

    message.innerText =
        "🤖 AI is analyzing your profile...";



    try {


        const response = await fetch(
            "https://careerone-backend.onrender.com/api/login",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    name: name,

                    branch: branch,

                    year: year,

                    skills: skills,

                    careerGoal:
                        careerGoal

                })

            }
        );



        const data =
            await response.json();



        console.log(
            "Analysis Response:",
            data
        );



        if (data.success === true) {


            // SAVE PROFILE

            localStorage.setItem(
                "careerAnalysis",
                JSON.stringify(data)
            );



            message.style.color = "green";

            message.innerText =
                "✅ Analysis completed!";



            // OPEN DASHBOARD

            setTimeout(function () {

                window.location.href =
                    "dashboard.html";

            }, 1000);


        }

        else {

            message.style.color =
                "red";

            message.innerText =
                data.message ||
                "Analysis failed.";

        }


    }


    catch (error) {


        console.error(
            "Career Analysis Error:",
            error
        );


        message.style.color =
            "red";


        message.innerText =
            "❌ Backend connection failed.";

    }

}

</script>


</body>

</html>
